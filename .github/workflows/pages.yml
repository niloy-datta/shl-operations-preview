name: Validate and deploy static preview

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check every client script
        run: |
          node --check site/demo.js
          node --check site/enterprise.js
      - name: Validate local assets and no network data calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("site")
          assert (root/"index.html").is_file(), "Missing classic entry page"
          assert (root/"enterprise.html").is_file(), "Missing enterprise entry page"
          for name in ("index.html", "enterprise.html"):
              doc = (root/name).read_text(encoding="utf-8")
              assert "read-only" in doc.lower() or "read only" in doc.lower(), name
              for path in re.findall(r'(?:src|href)="\./([^"#?]+)', doc):
                  assert (root/path).is_file(), f"Missing {name} asset: {path}"
          for script in root.glob("*.js"):
              js = script.read_text(encoding="utf-8")
              for forbidden in (r'\bfetch\s*\(', r'\bXMLHttpRequest\b',
                                r'\bWebSocket\s*\(', r'\blocalStorage\b',
                                r'\bsessionStorage\b'):
                  assert not re.search(forbidden, js), f"{script} must stay static-only"
          print("Public-only preview and local asset checks passed")
          PY

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
